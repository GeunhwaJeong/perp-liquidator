[workspace]
resolver = "3"
members = ["crates/common", "crates/cranker", "crates/liquidator"]

[workspace.package]
version = "0.1.0"
license = "Apache-2.0"
publish = false
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
bigdecimal = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
diesel = { version = "2.3", features = ["postgres", "numeric"] }
diesel-async = { version = "0.9", features = ["bb8", "postgres"] }
hex = "0.4"
num-bigint = "0.4"
prometheus = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
tonic = { version = "0.14", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
bcs = "0.1.6"

perp-bot-common = { path = "crates/common" }

# The margin formulas and event layouts the indexer is checked against, so that the bots and the
# indexer judge a position the same way. Move both together, to the indexer commit being run.
perp-engine = { git = "https://github.com/GeunhwaJeong/perp-indexer.git", rev = "d37bc387e54ad689314bcabf0b583146473d8c93" }
perp-types = { git = "https://github.com/GeunhwaJeong/perp-indexer.git", rev = "d37bc387e54ad689314bcabf0b583146473d8c93" }

# The Haneul Rust SDK, at the commit the indexer uses. Move every entry together.
haneul-crypto = { git = "https://github.com/GeunhwaJeong/haneul-rust-sdk.git", rev = "48cae861d5745a1bae0b28535e556cfe1c74d81e", features = ["ed25519", "bech32"] }
haneul-rpc = { git = "https://github.com/GeunhwaJeong/haneul-rust-sdk.git", rev = "48cae861d5745a1bae0b28535e556cfe1c74d81e" }
haneul-sdk-types = { git = "https://github.com/GeunhwaJeong/haneul-rust-sdk.git", rev = "48cae861d5745a1bae0b28535e556cfe1c74d81e", features = ["hash", "serde"] }
haneul-transaction-builder = { git = "https://github.com/GeunhwaJeong/haneul-rust-sdk.git", rev = "48cae861d5745a1bae0b28535e556cfe1c74d81e" }

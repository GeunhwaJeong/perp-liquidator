# Builds the liquidator, cranker and maker binaries for the servers (x86_64 Linux, glibc of
# ubuntu-24.04) on every push to main and on demand, and keeps them as a workflow artifact
# named after the commit. Download with `gh run download <run id> -n perp-bots-linux-x86_64`.
name: Release binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Build for a fixed CPU level, not the runner's. Without a target-cpu blst (linked
  # through fastcrypto) compiles for the CPU of the machine that builds it, and GitHub's
  # runners have ADX while the VPS (a Haswell-era vCPU) does not: the first binary died with
  # SIGILL. x86-64-v2 has no ADX, and blst follows the target features when one is given.
  RUSTFLAGS: "-C target-cpu=x86-64-v2"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - run: cargo build --release --locked -p perp-liquidator -p perp-cranker -p perp-maker
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/perp-liquidator target/release/perp-cranker target/release/perp-maker dist/
          strip dist/perp-liquidator dist/perp-cranker dist/perp-maker
          echo "${GITHUB_SHA}" > dist/COMMIT
          (cd dist && sha256sum perp-liquidator perp-cranker perp-maker > SHA256SUMS)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: perp-bots-linux-x86_64
          path: dist/
          retention-days: 90
          if-no-files-found: error
